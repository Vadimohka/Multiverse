name: Bug report
description: Report a reproducible problem in Multiverse.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, customer data, or security vulnerabilities."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include input, node configuration, and exact steps where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
