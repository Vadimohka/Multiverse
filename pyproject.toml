[project]
name = "multiverse-data-studio"
version = "0.1.0"
description = "Self-hosted visual data extraction and workflow automation platform"
requires-python = ">=3.14,<3.15"
authors = [
  { name = "Vladymtsev Vadim" },
]
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "sqlalchemy>=2.0.51",
  "alembic>=1.18.5",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "psycopg[binary]>=3.3.4",
  "PyJWT>=2.9",
  "cryptography>=50.0.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=6.1.1",
  "jsonpath-ng>=1.8.0",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "celery>=5.6.3",
  "redis>=8.1.0",
  "boto3>=1.43.62",
  "pymysql>=1.1",
  "playwright>=1.62.0",
  "jsonschema>=4.23",
  "python-docx>=1.2.0",
  "pypdf>=6.14.2",
]

[project.urls]
Homepage = "https://vadimohka.com"
Repository = "https://github.com/Vadimohka/Multiverse"
Issues = "https://github.com/Vadimohka/Multiverse/issues"
LinkedIn = "https://www.linkedin.com/in/vadimohka/"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.1", "mypy>=2.3.0"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/worker", "packages"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "E501", "E701", "E702"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
