[project]
name = "parser-studio"
version = "0.1.0"
description = "Self-hosted no-code data parsing studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "PyJWT>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "jsonpath-ng>=1.6",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "redis>=5.0",
  "boto3>=1.35",
  "pymysql>=1.1",
  "playwright>=1.49",
  "jsonschema>=4.23",
  "python-docx>=1.1",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "E501", "E701", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
